<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./assets/css/base.css">

    <!-- Normalize CSS -->
    <link rel="stylesheet" href="./assets/fonts/normalize.css-master/normalize.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="./assets/fonts/fontawesome-free-7.1.0-web/css/all.min.css">
</head>

<body>
<header class="web__header">
    <div class="grid">
        <div class="header__box">
            <div class="header__logo">
                SKILL
            </div>
            <div class="header__browse">
                <div class="browse__text">Browse</div>
                <i class="browse__icon fa-solid fa-angle-down"></i>
            </div>
            <div class="header__community">Community</div>
            <div class="header__search">
                <div class="search__icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="search__input">
                    <input type="text" class="input__text" placeholder="Search classes, digital product, teachers,...">
                </div>
            </div>
            <div class="header__class">My Class</div>
            <div class="header__notification">
                <i class="notification__icon fa-solid fa-bell"></i>
            </div>
            <div class="header__user">
                <img src="./assets/image/65472207_145188949876444_2344275901291692032_n.jpg" alt="" class="user__avatar">
            </div>
            <div class="header__button">
                <button class="button__btn">Start Now</button>
            </div>
        </div>
    </div>
</header>

</body>
</html>
